# Elder overload salve, from the RuneScape Wiki recipes as of November 2026.
# No Herblore master cape batch recipes. Potion stocks are doses, not vials.
# The first ingredient of each recipe cannot be saved by the Scroll of cleansing.
# https://runescape.wiki/w/Elder_overload_salve

target: Elder overload salve

aliases:
  Basic overload: Overload
  Overload potion: Overload
  Super magic: Super magic potion
  Super ranging: Super ranging potion

# dose: bank and recipes count doses, whatever vial size they sit in.
# item: one physical object (herb, secondary, unfinished potion, flask).
